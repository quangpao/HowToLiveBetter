<!-- Nguồn của og.png. Ba con số do node tools/sync-stats.mjs ghi vào, cùng một lệnh đó chụp lại og.png.
     Cách nhận diện chỗ cần ghi là thuộc tính data-stat="mục" | "A" | "nguồn" — đổi tên thuộc tính
     thì phải sửa bảng EDITS trong tools/sync-stats.mjs.
     Ba con số: số mục, số mục mức bằng chứng A, và số liên kết nguồn (đếm http(s) trong các dòng
     "- Nguồn:" và "- Ghi chú:" của book/). -->
<!doctype html><meta charset="utf-8">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;font-family:"Helvetica Neue",Arial,"PingFang SC",sans-serif;
  background:#fff;position:relative;overflow:hidden}
.bg{position:absolute;inset:0;
  background:radial-gradient(700px 420px at 88% 8%, rgba(100,108,255,.16), transparent 70%),
             radial-gradient(560px 380px at 4% 100%, rgba(16,185,129,.12), transparent 70%)}
.grid{position:absolute;inset:0;opacity:.5;
  background-image:linear-gradient(#eceded 1px,transparent 1px),linear-gradient(90deg,#eceded 1px,transparent 1px);
  background-size:48px 48px;
  -webkit-mask-image:linear-gradient(180deg,rgba(0,0,0,.55),transparent 78%)}
.in{position:relative;padding:76px 84px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:14px;font-size:23px;color:#3c3c43b8;font-weight:600;letter-spacing:.02em}
.logo{width:44px;height:44px;border-radius:11px;background:#3451b2;color:#fff;font-size:26px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.logo svg{width:28px;height:28px}
h1{margin-top:52px;font-size:52px;line-height:1.22;letter-spacing:-.02em;color:#1b1b1f;font-weight:700}
h1 em{font-style:normal;color:#3451b2}
p{margin-top:24px;font-size:26px;line-height:1.6;color:#3c3c43c7;max-width:1010px}
.chips{margin-top:auto;margin-bottom:8px;display:flex;gap:14px;flex-wrap:wrap}
.c{font-size:24px;font-weight:600;padding:12px 22px;border-radius:999px;background:#f6f6f7;color:#3c3c43c7;border:1px solid #e2e2e3}
.c b{color:#1b1b1f}
.c.a{background:rgba(16,185,129,.12);border-color:transparent;color:#18794e}
.c.u{background:rgba(100,108,255,.14);border-color:transparent;color:#3451b2}
.bar{position:absolute;left:0;top:0;width:100%;height:8px;background:linear-gradient(90deg,#3451b2,#5672cd 45%,#18794e)}
</style>
<div class="bg"></div><div class="grid"></div><div class="bar"></div>
<div class="in">
  <div class="brand"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>Cẩm nang sống thông minh</div>
  <h1>Bỏ ít tiền, thời gian và sức lực nhất,<br>đổi lấy <em>sống lâu, tiền và tự do</em></h1>
  <p>Sống lâu · phòng bệnh · cấp cứu · bớt tiêu oan · ranh giới pháp luật · nghề nghiệp · gia đình · du học</p>
  <div class="chips">
    <div class="c u"><b data-stat="mục">249</b> mục</div>
    <div class="c a">bằng chứng A <b data-stat="A">87</b> mục</div>
    <div class="c"><b data-stat="nguồn">722</b> liên kết nguồn</div>
    <div class="c">lọc theo mức đáng làm</div>
  </div>
</div>
