# Bản Việt: chạy trên nhánh vi (mặc định của repo)
# Nội dung đổi là dựng lại bốn bản, gắn vào Release cố định "epub-latest", link tải không đổi:
#   EPUB          https://github.com/quangpao/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.epub
#   PDF           https://github.com/quangpao/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.pdf
#   HTML một file https://github.com/quangpao/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.html
#   Bộ thẻ Anki   https://github.com/quangpao/HowToLiveBetter/releases/download/epub-latest/HowToLiveBetter.apkg
# PR chỉ dựng và kiểm, không phát hành; sản phẩm nằm trong artifact ở trang Actions.
name: Sách điện tử

on:
  push:
    branches: [vi]
    paths:
      - README.md
      - index.html
      - selfcheck.html
      - og.png
      - assets/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  pull_request:
    paths:
      - README.md
      - index.html
      - selfcheck.html
      - og.png
      - assets/**
      - book/**
      - docs/*.md
      - tools/**
      - .github/workflows/book.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: true

env:
  PANDOC_VERSION: '3.11'
  TYPST_VERSION: '0.15.1'

jobs:
  # Kiểm tham chiếu chéo. Tách thành job riêng, không gắn vào build: neo chưa bổ sung xong
  # không nên làm hỏng việc phát hành EPUB, PDF và HTML một file, hai việc đó không liên quan.
  # PR vẫn đỏ, nhánh vi vẫn phát hành bình thường. Chuỗi kiểm cục bộ (sync-stats.mjs) phải nhớ
  # chạy mới chạy, PR từ bên ngoài thì không chạy được, nên CI cần có một bản.
  # Không phụ thuộc gói ngoài, vài giây là xong.
  refs:
    name: Kiểm tham chiếu chéo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-refs.mjs --check

  # Kiểm văn phong: độ dài, thuật ngữ nghiên cứu, cách nói trừu tượng. Lý do như trên, job riêng, không chặn phát hành.
  vi-style:
    name: Kiểm văn phong tiếng Việt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/test-lint-vi.mjs
      - run: node tools/lint-vi.mjs

  plain:
    name: Kiểm "Nói dễ hiểu"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-plain.mjs

  # Kiểm trường pháp luật có dẫn nguồn, không thay cho rà soát hiệu lực.
  legal:
    name: Kiểm cấu trúc pháp luật Việt Nam
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-legal.mjs
      - run: node tools/test-check-draft.mjs
      - run: node tools/test-check-legal.mjs

  # Kiểm luật tách câu nhất quán: luật tách Lợi ích, Ghi chú và Nguồn quá dài có hai bản
  # (tools/lib/split-items.mjs cho EPUB và PDF, đoạn <split-rules> trong index.html cho web và bản offline).
  # Chỉ sửa một bên thì bốn đầu ra sẽ khác nhau. Lý do như trên, không chặn phát hành.
  split:
    name: Kiểm luật tách câu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-split.mjs

  # Kiểm số liệu thống kê: số mục, số mục A/B/C, số liên kết... trong README, index.html, og.html có khớp book/ không.
  # sync-stats.mjs cục bộ phải nhớ chạy mới cập nhật, PR gộp thẳng trên web thì không qua được nó. Lý do như trên, không chặn phát hành.
  # Chỉ kiểm, không sửa: để CI đẩy commit lên nhánh vi sẽ lệch với máy cục bộ, và Ubuntu không có phông Microsoft YaHei nên chụp og.png không đúng.
  stats:
    name: Kiểm số liệu thống kê
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # updates.mjs cần xem lịch sử git
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/sync-stats.mjs --check
      - run: node tools/updates.mjs --check

  selfcheck:
    name: Kiểm trang tự kiểm tra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-selfcheck.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/epub/package-lock.json

      - run: node tools/test-repo-links.mjs

      - run: npm ci
        working-directory: tools/epub

      - name: EPUB
        run: node tools/epub/build.mjs

      - name: HTML một file (offline)
        run: node tools/offline/build.mjs

      - name: Bộ thẻ Anki
        run: node tools/anki/build.mjs

      - name: Cài pandoc và typst
        run: |
          curl -sSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-linux-amd64.tar.gz" | tar xz
          curl -sSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" | tar xJ
          echo "$PWD/pandoc-${PANDOC_VERSION}/bin" >> "$GITHUB_PATH"
          echo "$PWD/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"

      - name: PDF
        run: node tools/pdf/build.mjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: epubcheck
        run: |
          curl -sSL -o epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q epubcheck.zip
          java -jar epubcheck-5.4.0/epubcheck.jar dist/HowToLiveBetter.epub

      - uses: actions/upload-artifact@v4
        with:
          name: HowToLiveBetter
          path: |
            dist/HowToLiveBetter.epub
            dist/HowToLiveBetter.pdf
            dist/HowToLiveBetter.html
            dist/HowToLiveBetter.apkg

      - name: Phát hành lên Release epub-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f epub-latest
          git push -f origin epub-latest
          notes="Bản nội dung ${GITHUB_SHA::7}, dựng lúc $(date -u -d '+7 hours' +'%Y-%m-%d %H:%M') (giờ Việt Nam). Gồm EPUB, PDF, HTML một file và bộ thẻ Anki; nội dung đổi là tự dựng lại, link tải giữ nguyên."
          if gh release view epub-latest >/dev/null 2>&1; then
            gh release edit epub-latest --title "Sách (EPUB / PDF / HTML offline / Anki, tự cập nhật)" --notes "$notes"
          else
            gh release create epub-latest --title "Sách (EPUB / PDF / HTML offline / Anki, tự cập nhật)" --notes "$notes" --latest=false
          fi
          gh release upload epub-latest \
            dist/HowToLiveBetter.epub \
            dist/HowToLiveBetter.pdf \
            dist/HowToLiveBetter.html \
            dist/HowToLiveBetter.apkg --clobber
