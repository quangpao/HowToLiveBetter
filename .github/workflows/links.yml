# Kiểm liên kết hỏng: mỗi thứ Hai chạy một lần trên toàn bộ liên kết ngoài của sách, kết quả ghi ở trang Summary của lần chạy.
# Chỉ báo cáo, không báo lỗi (mã thoát của script luôn là 0), nên workflow này luôn xanh, muốn xem kết quả phải bấm vào trong.
# Nhóm "chắc chắn hỏng" (404, 410, DOI không tồn tại) mới cần sửa;
# nhóm "không kết nối được" phần nhiều là trang chặn IP máy chủ nước ngoài, nhiều tuần liền vẫn thế mới đáng xem;
# nhóm "bắt tay mã hóa không tương thích" là trang nhà nước cũ dùng kiểu mã hóa Node không nhận, trình duyệt vẫn mở được, không cần sửa.
# Không gắn vào book.yml: hàng trăm trang ngoài thông hay không chẳng liên quan tới việc sửa nội dung, mỗi lần push đều chạy vừa chậm vừa ồn.
name: Kiểm liên kết hỏng

on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Kiểm liên kết hỏng
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/check-links.mjs
