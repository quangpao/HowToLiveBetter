name: Sửa lỗi - mục viết sai hoặc đã lỗi thời
description: Số liệu sai, quy định đã đổi, nguồn không mở được, câu chữ có chỗ sai
title: "Chương X, mục Y: "
labels: ["sửa lỗi"]
body:
  - type: input
    id: where
    attributes:
      label: Mục nào
      description: Dán liên kết mục hoặc ghi chương/mục. Nút Góp ý ở mỗi mục điền sẵn thông tin này.
      placeholder: Chương X, mục Y
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Chỗ nào sai
      description: Chép câu đang khó hiểu hoặc có thể sai, rồi nói điều bạn gặp. Bạn không cần biết sẵn đáp án đúng.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Nguồn đối chiếu (nếu có)
      description: Nếu có, gửi bài báo khoa học, nguyên văn điều luật hoặc trang cơ quan chính thức. Báo lỗi chữ, câu khó hiểu hay liên kết hỏng không bắt buộc phải có nguồn.
    validations:
      required: false
